<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parfum · Turnover Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="statusDot" data-state="idle"></span>
      <span class="wordmark">PARFUM<span class="sep">·</span>TURNOVER</span>
      <span class="tag">OLX.ua</span>
    </div>
    <div class="status" id="statusChips"><span class="muted">завантаження…</span></div>
    <button class="btn" id="crawlBtn">Зібрати зараз</button>
  </header>

  <section class="controls" id="controls">
    <label>Правило продажу
      <span class="hint">зникло у віці ≤</span>
      <span class="rangewrap"><input type="range" id="maxAge" min="5" max="45" step="1" value="21" /><output id="maxAgeOut">21 дн</output></span>
    </label>
    <label>Категорія
      <select id="category"><option value="">усі</option></select>
    </label>
    <label>Місто
      <select id="city"><option value="">вся Україна</option></select>
    </label>
    <label>Тип
      <select id="type">
        <option value="">будь-який</option>
        <option value="full">флакон</option>
        <option value="tester">тестер</option>
        <option value="decant">розпив</option>
      </select>
    </label>
    <label>Мін. продажів
      <select id="minSold"><option>2</option><option>3</option><option>5</option><option>8</option></select>
    </label>
  </section>

  <main class="board" id="board"></main>

  <footer class="foot">
    <span id="footMeta" class="muted"></span>
    <span class="muted">продаж ≈ молоде оголошення зникло · це проксі, дивись медіани, не поштучно</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
